# FakeFullscreen hotkey bindings.
#
# Format:  action = modifiers+key
# modifiers: ctrl, alt, shift, win  (combined with '+'; e.g. ctrl+alt+space)
# actions:  maximize_toggle, snap_left, snap_right, snap_top, snap_bottom
# Lines starting with '#' are comments.

maximize_toggle = ctrl+alt+space
snap_left       = ctrl+alt+left
snap_right      = ctrl+alt+right
snap_top        = ctrl+alt+up
snap_bottom     = ctrl+alt+down
